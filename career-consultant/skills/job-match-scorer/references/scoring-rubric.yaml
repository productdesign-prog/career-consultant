# Job match scoring rubric — SKILLS FROM THE RESUME ONLY. Total 100.
#
# Design intent: the score answers ONE question — do the candidate's skills/
# competencies (as evidenced in their resume) cover the skills the vacancy asks
# for? Nothing else is scored. Everything below is EXCLUDED from the score and
# reported as a non-blocking flag instead:
#   - seniority / grade level (e.g. role is Middle but candidate is Lead)
#   - domain / industry (e.g. consumer vs B2B, fintech vs medtech)
#   - location, work format, timezone, relocation
#   - compensation / salary
#   - language as a logistics requirement
#   - industry exclusions
# This keeps the funnel as wide as possible: the user decides which flags matter.

weights:
  required_skills_coverage: 55  # how many of the vacancy's required + preferred SKILLS are present in the resume
  evidence_strength: 30         # does the resume actually demonstrate those skills (outcomes, scale, shipped work)
  keyword_coverage: 15          # resume language overlaps the vacancy's SKILL terms, without stuffing

# Decisions are based on the skills score alone. Funnel-wide thresholds.
decisions:
  apply: "score >= 70"
  maybe: "45-69"
  reject: "score < 45"

# What is NOT scored — never let any of these move the number or the decision:
not_scored_flags:
  - seniority_level   # grade mismatch is a FLAG, not a deduction
  - domain_industry   # consumer vs B2B, sector fit, etc. is a FLAG
  - location
  - compensation
  - work_format
  - language
  - industry_exclusion

rules:
  - "Score only skills the resume actually contains vs skills the vacancy lists."
  - "An unmet skill costs coverage points; it never auto-rejects."
  - "Never lower the score because the role is below/above the candidate's grade, in a different domain, pays unknown/low, or is in another location. Flag it instead."
  - "Flag obvious scam/fake/lead-gen postings prominently, but leave the decision to the user."
