# Job match scoring rubric — SKILLS/CAPABILITY ONLY. Total 100.
#
# Design intent: the match score measures whether the candidate CAN do the job
# (skills, role fit, evidence), NOT whether the conditions suit them. Conditions
# (location, compensation, work format, language-as-logistics, industry) are
# reported as informational flags and NEVER change the score or the decision.
# This deliberately widens the funnel — the user decides which conditions matter.

weights:
  must_have_skills: 35  # the role's required skills/competencies
  role_fit: 25          # title, seniority, task type, scope, IC vs lead
  evidence_strength: 25 # metrics, shipped outcomes, scale, decisions, research, portfolio
  domain_fit: 10        # relevant domain/problem-space experience (capability, not a condition)
  keyword_coverage: 5   # overlap with the vacancy's skill language, without stuffing

# Decisions are based on the skills score alone (funnel-wide thresholds).
decisions:
  apply: "score >= 75"
  maybe: "55-74"
  reject: "score < 55"

# No condition-based hard-stops. An unmet must-have skill simply costs points
# (it does NOT auto-reject) — a candidate strong elsewhere can still be a Maybe.
conditions_policy: "Location, compensation, work format, language logistics, and industry are FLAGS ONLY. They never reduce the score and never force a reject. List them so the user can weigh them; the user decides."

# The only thing worth a hard caution is a clearly fake/scam/lead-gen posting —
# surface it as a prominent warning flag, but still leave the decision to the user.
integrity_flag: "Flag obvious scam/fake/lead-gen postings prominently; do not silently auto-reject."
